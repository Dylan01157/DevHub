name: 🚀 Deploy Static Site

# Déclenche le workflow sur push sur predev ou main, et via déclenchement manuel
on:
  push:
    branches:
      - predev
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # récupère tout l’historique

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧰 Build static site from Markdown
        run: node build-questions.js   # Ton script convertissant Markdown → HTML

      # ✅ Nouvelle étape : commit et création automatique d'une PR
      - name: Commit & create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Generate HTML from Markdown [skip ci]"
          branch: predev-gh-pages-temp       # branche temporaire
          base: predev                        # PR vers predev
          title: "Mise à jour automatique des questions"
          body: "Mise à jour automatique générée par GitHub Actions"
          labels: "automerge"  # optionnel

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚚 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
