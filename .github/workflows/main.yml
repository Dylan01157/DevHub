name: 🚀 Deploy Static Site

# Déclenche le workflow sur push sur predev ou main, ou via déclenchement manuel
on:
  push:
    branches:
      - predev
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # pour récupérer tout l’historique

      # 2️⃣ Installer Node.js
      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Installer les dépendances
      - name: 📦 Install dependencies
        run: npm ci

      # 4️⃣ Générer les HTML depuis Markdown
      - name: 🧰 Build static site from Markdown
        run: node build-questions.js

      # 5️⃣ Commit & push les fichiers générés sur predev avec PAT
      - name: 📤 Commit & push HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "bot@github.com"
          git add build index.html
          git commit -m "Generate HTML from Markdown [skip ci]" || echo "No changes to commit"
          git push https://${{ secrets.PAT_TOKEN }}@github.com/Dylan01157/DevHub HEAD:predev


      # 6️⃣ Upload le dossier build pour GitHub Pages
      - name: 📤 Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚚 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
