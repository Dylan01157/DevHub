name: 🚀 Deploy Static Site

# Déclenche le workflow sur push sur predev ou main, et via déclenchement manuel
on:
  push:
    branches:
      - predev
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧰 Build static site from Markdown
        run: node build-questions.js   # Ton script convertissant Markdown → HTML

      - name: 💾 Commit generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add questions/ index.html
          git commit -m "Generate HTML from Markdown [skip ci]" || echo "No changes to commit"
          git push origin predev


      - name: 📤 Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'   # Le dossier à déployer (racine ou ./build si tu génères dedans)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚚 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
